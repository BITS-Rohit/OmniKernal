[project]
name = "omnikernal"
version = "0.1.0"
description = "A secure, database-driven, multi-platform bot automation engine using a Microkernel (Plugin) Architecture"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "BITS-Rohit", email = "rohitguptaradheradhe2004@gmail.com" }
]
keywords = [
    "automation",
    "microkernel",
    "plugin",
    "bot",
    "multi-platform",
    "whatsapp",
    "playwright",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Intended Audience :: Developers",
]

dependencies = [
    # Database Layer
    "sqlalchemy>=2.0.48",
    "aiosqlite>=0.20.0",                   # Async SQLite driver
    # Configuration and serialization
    "pyyaml>=6.0.3",
    # Platform adapter (scaffold support)
    "playwright>=1.58.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# Core test suite
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
# Code quality
linting = [
    "ruff>=0.15.13",
    "mypy>=1.10.0",
    "deptry>=0.25.1",
    "pre-commit>=3.7.0",
]
# Convenience group
dev = [
    "omnikernal[testing]",
    "omnikernal[linting]",
]
database-extras = [
    "aiosqlite>=0.20.0",   # async SQLite support
    "aiomysql>=0.2.0",     # async MySQL support (optional)
    "asyncpg>=0.29.0",     # async PostgreSQL support (optional)
]

[project.urls]
"Homepage"    = "https://github.com/BITS-Rohit/OmniKernal"
"Bug Tracker" = "https://github.com/BITS-Rohit/OmniKernal/issues"
"Source"      = "https://github.com/BITS-Rohit/OmniKernal"

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"omnikernal" = "src"}

# ---------------------------------------------------------------------------
# uv dependency-groups (uv sync / uv run — replaces [project.optional-dependencies] for uv users)
# ---------------------------------------------------------------------------
[dependency-groups]
# Core test suite
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "types-pyyaml",     # mypy stubs for pyyaml
    "types-psutil",     # mypy stubs for psutil
]
# Code quality tools
linting = [
    "ruff>=0.15.13",
    "mypy>=1.10.0",
    "deptry>=0.25.1",
    "pre-commit>=3.7.0",
]
# Top-level dev group — includes all sub-groups
dev = [
    { include-group = "testing" },
    { include-group = "linting" },
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select  = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore  = ["E501"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
warn_return_any        = true
warn_unused_configs    = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
strict_optional = false
warn_return_any = false
warn_no_return = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-v --cov=src --cov-report=term-missing"

[tool.deptry]
package_module_name_map = { "pyyaml" = "yaml", "aiomysql" = "aiomysql", "asyncpg" = "asyncpg" }
per_rule_ignores = { "DEP002" = ["aiosqlite", "playwright", "aiomysql", "asyncpg"] }
optional_dependencies_dev_groups = ["testing", "linting", "dev", "database-extras"]
