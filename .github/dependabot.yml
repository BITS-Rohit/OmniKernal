# .github/dependabot.yml
version: 2
updates:
  # 1. Keep your uv dependencies and uv.lock file up to date
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "BITS-Rohit"
    reviewers:
      - "BITS-Rohit"

  # 2. Keep your GitHub Actions workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "BITS-Rohit"
    reviewers:
      - "BITS-Rohit"
